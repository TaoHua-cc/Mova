vo=gpu-next
gpu-api=d3d11
hwdec=auto-safe
target-colorspace-hint=yes
tone-mapping=auto
sub-ass=yes
sub-ass-override=no
blend-subtitles=video
sub-hdr-peak=auto
keep-open=no
save-position-on-quit=no
# Own-window player (v2.0.130): the mpv window carries the full V9 console via
# yingji-osc.lua, so the app window is hidden during playback. osc=no (native
# OSC would double up next to our lua-drawn OSC). osd-level=1 (ass subtitles
# + the lua-drawn OSC; the level-2 media OSD would double up next to ours).
# window-dragging=yes lets the user move the borderless window with the mouse.
osc=no
osd-level=1
input-default-bindings=no
window-dragging=yes
