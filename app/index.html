<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>映迹</title><style>

;color:#10130b}.secondary{border:1px solid #4a535e;background:#10151bcc;color:#fff}.hero-source{position:absolute;right:34px;bottom:54px;padding:11px 14px;border-radius:12px;background:#0b0f14e8}.hero-source:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--focus);margin-right:9px}.content{padding:0 34px 70px}.module{margin-top:40px}.module:first-child{margin-top:6px}.head{display:flex;align-items:end;margin-bottom:14px}.head h2{margin:0;font-size:22px}.head p{margin:0 0 2px 12px;color:#939ca6}.head button{margin-left:auto;border:0;background:transparent;color:#b4bbc3}.rankrow{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:14px}.item{min-width:0;cursor:pointer}.poster{height:210px;border-radius:12px;position:relative;overflow:hidden;background-image:url('yingji-posters-original.png');background-size:400% 200%;box-shadow:0 14px 28px #0007}.poster:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#080a0dba,transparent 44%)}.poster:after{content:attr(data-rank);position:absolute;bottom:-13px;left:8px;font:700 60px Georgia;color:#fff;text-shadow:0 3px 10px #000}.item b{display:block;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small{color:#929ba4}.item:focus{outline:0}.item:focus .poster,.item:hover .poster{outline:3px solid var(--focus);outline-offset:3px}.p0{background-position:0 0}.p1{background-position:33.333% 0}.p2{background-position:66.666% 0}.p3{background-position:100% 0}.p4{background-position:0 100%}.p5{background-position:33.333% 100%}.p6{background-position:66.666% 100%}.p7{background-position:100% 100%}.detail{min-height:calc(100vh - 108px);padding:62px 4vw;background-image:linear-gradient(90deg,#080a0df5 0,#080a0de2 43%,#080a0d70 78%),url('yingji-hero-original.png');background-size:cover;background-position:center}.back{border:0;background:transparent;color:#bdc3ca;padding:0;margin-bottom:30px}.detail h1{font-size:50px;margin:0 0 8px}.desc{max-width:720px;color:#bdc4cc}.tabs{display:flex;gap:25px;margin-top:28px;border-bottom:1px solid var(--line)}.tabs span{padding:11px 0}.tabs .on{border-bottom:2px solid var(--focus)}.episodes{display:flex;gap:10px;margin:16px 0 25px}.ep{width:92px;text-align:left;border:1px solid #343c46;background:#141920;color:#b5bdc6;border-radius:10px;padding:10px}.ep.on{background:var(--focus);color:#12160c;border-color:var(--focus);font-weight:800}.sources{max-width:980px;background:#0e1217;border-radius:14px;padding:18px}.source{display:grid;grid-template-columns:1fr 170px 150px 100px;gap:14px;padding:14px 0;border-top:1px solid var(--line);align-items:center}.source:first-of-type{border-top:0}.source.best{color:#fff}.source.best .quality{color:var(--focus)}.source.offline{opacity:.55}.play{position:fixed;inset:44px 0 0;background:#050607 url('yingji-hero-original.png') center/cover;z-index:18}.play:after{content:"";position:absolute;inset:0;background:#02030538}.toast{position:absolute;z-index:2;top:26px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#11161dee;border-radius:12px}.toast b{color:var(--focus)}.danmu{position:absolute;z-index:2;inset:170px 12% auto;display:grid;gap:55px;text-shadow:0 2px 5px #000}.danmu span:nth-child(2){margin-left:46%}.hud{position:absolute;z-index:2;left:24px;right:24px;bottom:22px;background:#0b0f14e8;border-radius:14px;padding:17px}.timeline{height:4px;background:#ffffff2b}.timeline i{display:block;width:38%;height:100%;background:var(--focus)}.controls{display:flex;gap:22px;margin-top:14px}.controls .right{margin-left:auto}.close-player{position:absolute;z-index:3;top:18px;left:22px;border:0;background:#11161dcc;color:#fff;border-radius:10px;padding:9px 13px}.settings{padding:46px 4vw}.settings h1{font-size:38px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:var(--surface);border-radius:14px;padding:20px}.panel h2{margin-top:0}.config{display:flex;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.config:first-of-type{border-top:0}.config span{margin-left:auto;color:var(--sub)}.delete{margin-left:10px;border:0;background:transparent;color:var(--danger)}form{display:grid;grid-template-columns:1fr 1.5fr auto;gap:8px;margin-top:16px}form input{min-width:0;background:#0c1015;border:1px solid #343c46;border-radius:8px;color:#fff;padding:10px}form button{border:0;background:var(--focus);color:#11150b;border-radius:8px;padding:10px 14px;font-weight:700}.empty{color:var(--sub);padding:20px 0}.statusline{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#151b22;padding:10px 16px;border-radius:10px;z-index:30;display:none}.statusline.show{display:block}@media(max-width:1100px){.rankrow{grid-template-columns:repeat(6,minmax(0,1fr))}.item:nth-child(n+7){display:none}.search{width:240px}.hero{padding-left:44px}.hero-source{display:none}}@media(max-width:800px){.rankrow{grid-template-columns:repeat(4,1fr)}.item:nth-child(n+5){display:none}.settings-grid{grid-template-columns:1fr}.search{display:none}.source{grid-template-columns:1fr 120px}.source>*:nth-child(n+3){display:none}}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style><link rel="stylesheet" href="yingji-theme.css"><link rel="stylesheet" href="desktop.css"></head><body><div id="app" class="app"></div><div id="status" class="statusline" role="status" aria-live="polite"></div><script>
const posters=['p0','p1','p2','p3','p4','p5','p6','p7'];
const titles=['边界来信','山海之间','轨道之外','归途','逆风而行','长夜将明','无声追踪','极峰救援'];
const modules=[['国内热门电视剧',[4,5,0,1,2,3,6,7]],['国内热门电影',[4,6,5,7,1,0,3,2]],['全球热门剧集',[2,3,6,0,1,7,5,4]],['全球热门电影',[7,5,3,2,6,4,1,0]],['高分口碑新作',[1,4,0,6,5,2,7,3]],['片库可播放榜',[0,1,2,3,4,5,6,7]]];
const media={title:'边界来信',year:2026,desc:'调查员在废弃卫星中发现来自未来的私人通信。每一次接收，都在改变当下的现实。',watched:[1,2,3,4],episodes:[1,2,3,4,5,6,7,8]};
const defaults=[{name:'家庭影库',url:'https://home.example.com',online:true},{name:'云端媒体库',url:'https://cloud.example.com',online:true},{name:'朋友共享库',url:'https://friend.example.com',online:false}];
const state={view:'home',episode:5,theme:localStorage.getItem('yingji.theme')||'dark',layout:'left',moduleOrder:JSON.parse(localStorage.getItem('yingji.moduleOrder')||'null')||modules.map((_,i)=>i),watchlist:JSON.parse(localStorage.getItem('yingji.watchlist')||'[0,2,4]'),servers:JSON.parse(localStorage.getItem('yingji.servers')||'null')||[],danmaku:JSON.parse(localStorage.getItem('yingji.danmu')||'null')||[]};
document.head.insertAdjacentHTML('beforeend','<link rel="stylesheet" href="yingji-theme.css">');
const app=document.querySelector('#app'),status=document.querySelector('#status');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={home:'<path d="M3 11 12 4l9 7v9H6v-9"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4m8-4v4M3 10h18"/>',watch:'<path d="M5 4h14v17l-7-4-7 4z"/>',library:'<rect x="4" y="4" width="6" height="16" rx="1"/><rect x="14" y="4" width="6" height="16" rx="1"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1-2-4-2 1a7 7 0 0 0-2-1l-.3-2h-5L9 6a7 7 0 0 0-2 1L5 6 3 10l2 1a7 7 0 0 0 0 2l-2 1 2 4 2-1a7 7 0 0 0 2 1l.5 2h5l.5-2a7 7 0 0 0 2-1l2 1 2-4-2-1z"/>',search:'<circle cx="11" cy="11" r="6"/><path d="m16 16 5 5"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/>',moon:'<path d="M20 15a8 8 0 1 1-11-11 7 7 0 0 0 11 11z"/>',layout:'<path d="M4 4h16v16H4zM9 4v16"/>',top:'<path d="M4 4h16v16H4zM4 9h16"/>'};
const ico=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;
function shell(body,active='home'){const nav=[['home','首页'],['calendar','日历'],['watchlist','待看'],['library','媒体库'],['downloads','下载'],['settings','设置'],['search','搜索']].map(([id,label])=>`<button class="${active===id?'on':''}" data-go="${id}">${ico(id==='watchlist'?'watch':id==='downloads'?'download':id)}<span>${label}</span></button>`).join('');return `<header class="chrome"><b class="brand">映迹</b><div class="win"><span>—</span><span>□</span><span>×</span></div></header><nav class="bar"><div class="nav">${nav}</div><div class="view-tools"><button data-theme title="${state.theme==='dark'?'切换浅色模式':'切换深色模式'}" aria-label="切换明暗主题">${ico(state.theme==='dark'?'sun':'moon')}</button><button data-layout title="${state.layout==='top'?'切换左侧导航':'切换顶部导航'}" aria-label="切换导航布局">${ico(state.layout==='top'?'layout':'top')}</button></div></nav>${body}`}
function poster(i,rank){return `<article class="item" tabindex="0" role="button" data-detail="${i}" aria-label="查看${titles[i]}详情"><div class="poster ${posters[i]}" data-rank="${rank}"></div><b>${titles[i]}</b><small class="${i<6?'available':''}">${i<6?'片库已有':'尚未入库'} · ${(9.1-rank*.13).toFixed(1)}</small></article>`}
function home(){const rows=state.moduleOrder.map((mi,pos)=>{const[name,ids]=modules[mi];return `<section class="module"><div class="head"><h2>${name}</h2><p>TMDB / Trakt · 今日更新</p><div class="module-tools"><button data-move="${pos}:-1" ${pos===0?'disabled':''} title="上移榜单">↑</button><button data-move="${pos}:1" ${pos===state.moduleOrder.length-1?'disabled':''} title="下移榜单">↓</button><button>查看全部</button></div></div><div class="rankrow">${ids.map((id,i)=>poster(id,i+1)).join('')}</div></section>`}).join('');app.innerHTML=shell(`<section class="hero"><div class="meta"><b>片库已有资源</b>　2026 · 科幻 / 悬疑 · TMDB 8.4</div><h1>边界来信</h1><p>本周全球热度上升最快的科幻剧集。完整海报来自 TMDB，英文条目优先读取中文本地化并缓存。</p><div class="actions"><button class="primary" data-detail="0">查看第 5 集资源</button><button class="secondary" data-watch="0">${state.watchlist.includes(0)?'✓ 已加入待看':'＋ 加入待看'}</button></div><div class="hero-source">家庭影库 · 4K Dolby Vision · 直连</div></section><main class="content"><p class="translation-note">中文优先级：TMDB zh-CN → TMDB 翻译条目 → 翻译服务；最终中文标题与简介保存到本机缓存。</p>${rows}</main>`,'home')}
function detail(){const first=media.episodes.find(e=>!media.watched.includes(e))||media.episodes.at(-1);state.episode=state.episode||first;const eps=media.episodes.map(e=>`<button class="ep ${e===state.episode?'on':''}" data-episode="${e}">${String(e).padStart(2,'0')}<br><small>${media.watched.includes(e)?'已播放':e===first?'最早未播':'未播放'}</small></button>`).join('');const sources=state.servers.map((s,i)=>`<div class="source ${i===0&&s.online?'best':''} ${s.online?'':'offline'}"><div><b>${esc(s.name)}</b><br><small>${s.online?'可用':'连接超时 · 可重试'}</small></div><span class="quality">${i?'1080P':'4K Dolby Vision'}</span><span>${i?'H.264 · 转码':'HEVC · 直连'}</span><span>${s.online?(18+i*45)+' ms':'不可用'}</span></div>`).join('')||'<div class="empty">尚未添加服务器。请先前往设置添加 Emby 服务器。</div>';app.innerHTML=shell(`<main class="detail"><button class="back" data-go="home">← 返回首页</button><h1>${media.title}</h1><div class="meta">${media.year} · 科幻 / 悬疑 · 3 季 · TMDB 8.4 · Trakt 热度 92</div><p class="desc">${media.desc}</p><div class="actions"><button class="primary" data-play>▶ 播放第 ${state.episode} 集</button><button class="secondary">加入片单</button><button class="secondary">整季下载</button></div><h2>选集与资源</h2><div class="episodes">${eps}</div><section class="sources"><h2>第 ${state.episode} 集资源</h2><p>已搜索 ${state.servers.length} 个 Emby 服务器，优先选择直连、画质最高且延迟最低的版本。</p>${sources}</section><div class="info-sections"><section class="info-block"><h2>预告片</h2><div class="trailer"><div><b>官方预告 · 2:14</b><br><small>来源：TMDB 视频资料</small></div><button class="primary">▶ 播放预告</button></div></section><section class="info-block"><h2>演员</h2><div class="cast"><div class="person"><b>林岚</b><small>饰 周言</small></div><div class="person"><b>陈默</b><small>饰 顾行舟</small></div><div class="person"><b>许冬</b><small>饰 叶澜</small></div><div class="person"><b>秦舟</b><small>饰 罗森</small></div><div class="person"><b>周野</b><small>饰 韩潮</small></div></div></section><section class="info-block"><h2>影片资料</h2><p>${media.desc}</p><p><b>类型</b>　科幻、悬疑　　<b>首播</b>　2026　　<b>制作地区</b>　中国大陆　　<b>数据来源</b>　TMDB / Trakt</p></section></div></main>`)}
function player(){const api=state.danmaku[0];app.innerHTML=`<section class="play"><button class="close-player" data-go="detail">← 返回详情</button><div class="toast">${api?`<b>弹幕匹配成功</b>　${esc(api.name)} · 20,686 条 · 偏移 +0.8 秒`:'未配置弹幕 API，当前无弹幕'}</div>${api?'<div class="danmu"><span>这个伏笔终于回收了</span><span>前方高能</span><span>原来第一集就暗示过</span></div>':''}<div class="hud"><div class="timeline"><i></i></div><div class="controls"><b>▶</b><span>18:24 / 46:02</span><span>下一集</span><span>切换资源</span><span class="right">弹幕　音轨　字幕　倍速　4K DV　全屏</span></div></div></section>`}
function settings(){const list=(items,type)=>items.length?items.map((x,i)=>`<div class="config"><div><b>${esc(x.name)}</b><br><small>${esc(x.url)}</small></div><span>${type==='servers'?(x.online?'在线':'未测试'):'已启用'}</span><button class="delete" data-delete="${type}:${i}" aria-label="删除${esc(x.name)}">删除</button></div>`).join(''):'<div class="empty">尚未添加。</div>';app.innerHTML=shell(`<main class="settings"><h1>连接中心</h1><p>演示配置保存在当前浏览器本机。正式版将使用系统安全凭据存储。</p><div class="settings-grid"><section class="panel"><h2>Emby 服务器</h2>${list(state.servers,'servers')}<form data-form="servers"><input name="name" maxlength="40" required placeholder="服务器名称"><input name="url" type="url" required placeholder="https://emby.example.com"><button>添加</button></form></section><section class="panel"><h2>弹幕 API</h2>${list(state.danmaku,'danmaku')}<form data-form="danmaku"><input name="name" maxlength="40" required placeholder="接口名称"><input name="url" type="url" required placeholder="https://api.example.com"><button>添加</button></form></section></div></main>`,'settings')}
function detailV2(){const first=media.episodes.find(e=>!media.watched.includes(e))||media.episodes.at(-1);state.episode=state.episode||first;const eps=media.episodes.map(e=>`<button class="episode-card ${e===state.episode?'on':''}" data-episode="${e}"><div class="episode-still" style="background-position:${e%2?'center':'60% center'}"></div><div class="episode-copy"><h3>第 ${e} 集 · ${['回声边界','旧日坐标','静默监听','深夜访客','失重讯号','黑箱协议','观察者','时间差'][e-1]}</h3><p>${['一次异常讯号打破了观测站的平静。','调查组发现两份互相矛盾的旧记录。','所有频道在同一时刻陷入静默。','陌生访客带来一段尚未发生的影像。','未来讯息第一次明确提及调查员本人。','小组决定打开被封存十年的黑箱。','新的观察者开始记录他们的一举一动。','两条时间线终于发生交汇。'][e-1]}</p><span class="episode-date">${new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric'}).format(new Date(2026,7,18+e))} 更新 · ${media.watched.includes(e)?'已播放':e===first?'最早未播':'未播放'}</span></div></button>`).join('');const sources=state.servers.map((s,i)=>`<div class="source ${i===0&&s.online?'best':''} ${s.online?'':'offline'}"><div><b>${esc(s.name)}</b><br><small>${s.online?'可用':'连接超时 · 可重试'}</small></div><span class="quality">${i?'1080P':'4K Dolby Vision'}</span><span>${i?'H.264 · 转码':'HEVC · 直连'}</span><span>${s.online?(18+i*45)+' ms':'不可用'}</span></div>`).join('')||'<div class="empty">媒体库还没有服务器，请先添加 Emby 服务器。</div>';const people=['林岚','陈默','许冬','秦舟','周野'];app.innerHTML=shell(`<main class="detail"><button class="back" data-go="home">← 返回首页</button><h1>${media.title}</h1><div class="meta">${media.year} · 科幻 / 悬疑 · 3 季 · TMDB 8.4 · Trakt 热度 92</div><p class="desc">${media.desc}</p><div class="actions"><button class="primary" data-play>▶ 播放第 ${state.episode} 集</button><button class="secondary" data-watch="0">${state.watchlist.includes(0)?'✓ 已加入待看':'＋ 加入待看'}</button><button class="secondary">整季下载</button></div><h2>选集与资源</h2><div class="episode-cards">${eps}</div><section class="sources"><h2>第 ${state.episode} 集资源</h2><p>已搜索 ${state.servers.length} 个 Emby 服务器，优先选择直连、画质最高且延迟最低的版本。</p>${sources}</section><div class="info-sections"><section class="info-block"><h2>预告片</h2><div class="trailer"><div><b>官方预告 · 2:14</b><br><small>来源：TMDB 视频资料</small></div><button class="primary">▶ 播放预告</button></div></section><section class="info-block"><h2>演员</h2><div class="cast">${people.map((n,i)=>`<div class="person"><div class="person-photo p${i}"></div><div class="person-copy"><b>${n}</b><small>饰 ${['周言','顾行舟','叶澜','罗森','韩潮'][i]}</small></div></div>`).join('')}</div></section><section class="info-block"><h2>影片资料</h2><p>${media.desc}</p><p><b>类型</b>　科幻、悬疑　　<b>首播</b>　2026　　<b>数据来源</b>　TMDB / Trakt</p></section></div></main>`)}
function calendar(){const base=new Date(2026,7,24),fmt=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'});const tracked=state.watchlist.length?state.watchlist:[0,2,4];const days=Array.from({length:10},(_,i)=>{const d=new Date(base);d.setDate(d.getDate()+i-2);const hasShow=[0,2,4,6,8].includes(i);const id=tracked[i%tracked.length]??0;const show=hasShow?`<div class="airing"><div class="calendar-poster p${id}" role="img" aria-label="${titles[id]}海报"></div><div class="airing-copy"><b>${titles[id]}</b><span>第 ${5+i} 集 · 20:00 更新</span><small>${i%2?'来自待看列表':'来自 Trakt 观看记录'} · 已匹配 Emby 资源</small></div><button class="secondary" data-detail="${id}">查看详情</button></div>`:'<div class="calendar-empty">暂无追剧更新</div>';return `<article class="day ${i===2?'today':''}"><div class="day-label"><h3>${fmt.format(d)}</h3><small>${i===2?'今天':i<2?'已过去':'未来更新'}</small></div>${show}</article>`}).join('');app.innerHTML=shell(`<main class="calendar-page"><div class="page-heading"><div><h1>追剧日历</h1><p>自动汇总待看内容和 Trakt 观看记录，从前天显示到未来一周。</p></div><span class="page-stat">当前窗口 · 5 部更新</span></div><div class="calendar-range">${days}</div></main>`,'calendar')}
function watchlist(){const cards=state.watchlist.map((id,i)=>`<article class="watch-card"><div class="watch-poster p${id}"></div><div class="watch-copy"><b>${titles[id]}</b><p>下一集预计 ${i+1} 天后更新</p><button class="secondary" data-detail="${id}">查看详情</button></div></article>`).join('')||'<div class="empty">待看列表为空。在影片详情页点击“加入待看”。</div>';app.innerHTML=shell(`<main class="simple-page"><h1>待看</h1><p>加入待看的剧集会自动进入追剧日历。</p><div class="watch-grid">${cards}</div></main>`,'watchlist')}
function library(){const rows=state.servers.map((s,i)=>`<div class="config"><div><b>${esc(s.name)}</b><br><small>${esc(s.url)}</small></div><span>${s.online?'在线':'未测试'}</span><button class="delete" data-delete="servers:${i}">删除</button></div>`).join('')||'<div class="empty">尚未添加 Emby 服务器。</div>';app.innerHTML=shell(`<main class="simple-page"><h1>媒体库</h1><p>管理 Emby 服务器并查看跨服务器统一片库。</p><div class="library-grid"><section class="panel"><h2>Emby 服务器</h2>${rows}<form data-form="servers"><input name="name" maxlength="40" required placeholder="服务器名称"><input name="url" type="url" required placeholder="https://emby.example.com"><button>添加</button></form></section><section class="panel"><h2>统一片库</h2><p>已合并 ${state.servers.length} 个服务器中的同名影片；TMDB ID、IMDb ID、年份和标题别名用于去重。</p><div class="config"><b>影片与剧集</b><span>1,248 项</span></div><div class="config"><b>需要人工确认的重复项</b><span>6 项</span></div></section></div></main>`,'library')}
function downloads(){app.innerHTML=shell(`<main class="simple-page"><h1>下载</h1><p>离线内容、空间和任务状态。</p><div class="download-grid"><article class="panel"><h2>边界来信 · 第 5 集</h2><p>4K HEVC · 8.2 GB</p><div class="timeline"><i style="width:62%"></i></div></article><article class="panel"><h2>山海之间 · 第 8 集</h2><p>1080P · 等待中</p></article></div></main>`,'downloads')}
function searchPage(){app.innerHTML=shell(`<main class="search-page"><h1>搜索</h1><input class="search-large" autofocus placeholder="搜索 TMDB、Trakt 与所有 Emby 服务器"><p class="translation-note">英文标题会优先读取 TMDB 中文翻译；缺失时翻译并保存中文缓存。</p></main>`,'search')}
function settingsV2(){const d=state.danmaku.map((x,i)=>`<div class="config"><div><b>${esc(x.name)}</b><br><small>${esc(x.url)}</small></div><span>已启用</span><button class="delete" data-delete="danmaku:${i}">删除</button></div>`).join('')||'<div class="empty">尚未添加弹幕 API。</div>';app.innerHTML=shell(`<main class="settings"><h1>设置</h1><div class="settings-grid"><section class="panel"><h2>数据来源</h2><div class="config"><b>TMDB</b><span>海报、中文资料、剧集、演员</span></div><div class="config"><b>Trakt</b><span>趋势、观看记录、追剧日历</span></div><p>API 密钥将在正式 Windows 版本中进入系统安全凭据存储。</p></section><section class="panel"><h2>弹幕 API</h2>${d}<form data-form="danmaku"><input name="name" maxlength="40" required placeholder="接口名称"><input name="url" type="url" required placeholder="https://api.example.com"><button>添加</button></form></section></div></main>`,'settings')}
function render(){document.body.classList.toggle('light',state.theme==='light');document.body.classList.toggle('nav-left',state.layout==='left');({home,detail:detailV2,player,settings:settingsV2,calendar,watchlist,library,downloads,search:searchPage}[state.view]||home)();scrollTo(0,0)}
function notify(msg){status.textContent=msg;status.classList.add('show');setTimeout(()=>status.classList.remove('show'),1800)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-detail],[data-episode],[data-play],[data-delete],[data-theme],[data-layout],[data-move],[data-watch]');if(!t)return;if(t.hasAttribute('data-theme')){state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('yingji.theme',state.theme);render()}else if(t.hasAttribute('data-layout')){state.layout=state.layout==='top'?'left':'top';localStorage.setItem('yingji.layout',state.layout);render()}else if(t.dataset.move){const[p,d]=t.dataset.move.split(':').map(Number),q=p+d;[state.moduleOrder[p],state.moduleOrder[q]]=[state.moduleOrder[q],state.moduleOrder[p]];localStorage.setItem('yingji.moduleOrder',JSON.stringify(state.moduleOrder));home();notify('榜单顺序已保存')}else if(t.dataset.watch!==undefined){const id=Number(t.dataset.watch),i=state.watchlist.indexOf(id);i<0?state.watchlist.push(id):state.watchlist.splice(i,1);localStorage.setItem('yingji.watchlist',JSON.stringify(state.watchlist));render();notify(i<0?'已加入待看和追剧日历':'已移出待看')}else if(t.dataset.go){state.view=t.dataset.go;render()}else if(t.dataset.detail!==undefined){state.view='detail';render()}else if(t.dataset.episode){state.episode=Number(t.dataset.episode);detailV2()}else if(t.hasAttribute('data-play')){state.view='player';render()}else if(t.dataset.delete){const[type,i]=t.dataset.delete.split(':');state[type].splice(Number(i),1);localStorage.setItem('yingji.'+type,JSON.stringify(state[type]));render();notify('已删除')}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-detail]'))e.target.click();if(e.key==='Escape'&&state.view==='player'){state.view='detail';render()}});
document.addEventListener('submit',e=>{e.preventDefault();const type=e.target.dataset.form;if(!type)return;const f=new FormData(e.target),name=f.get('name').trim(),url=f.get('url').trim();try{new URL(url)}catch{return notify('请输入完整的 http 或 https 地址')}state[type].push(type==='servers'?{name,url,online:false}:{name,url});localStorage.setItem('yingji.'+type,JSON.stringify(state[type]));render();notify('已添加 '+name)});
render();
</script><script src="integration.js"></script><script src="desktop.js"></script></body></html>
