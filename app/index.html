<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>映迹</title><link rel="stylesheet" href="forward.css"><link rel="stylesheet" href="navigation-repair.css"><link rel="stylesheet" href="apple-tv-rankings.css"></head><body><div id="app" class="app"></div><div id="status" class="statusline" role="status" aria-live="polite"></div><script>
const app=document.querySelector('#app'),status=document.querySelector('#status');
const safeLocalJson=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
const state={view:'home',theme:localStorage.getItem('yingji.theme')||'dark'};
const yjNavigation={stack:[]};
const yjRouteSnapshot=()=>({view:state.view,detail:typeof live==='undefined'?null:live.detail,openSourceId:typeof live==='undefined'?null:live.openSourceId||null,selectedSourceId:typeof live==='undefined'?null:live.selectedSourceId||null,collectionKind:typeof live==='undefined'?null:live.collectionKind||null,rankingIndex:typeof live==='undefined'?null:live.rankingIndex});
const yjRememberRoute=()=>{const current=yjRouteSnapshot(),previous=yjNavigation.stack.at(-1);if(previous&&previous.view===current.view&&previous.detail===current.detail&&previous.openSourceId===current.openSourceId)return;yjNavigation.stack.push(current);if(yjNavigation.stack.length>32)yjNavigation.stack.shift()};
const yjNavigate=view=>{if(state.view!==view)yjRememberRoute();state.view=view;render()};
const yjBack=()=>{try{if(typeof live!=='undefined')live.detailLoadKey=(live.detailLoadKey||0)+1;let previous=yjNavigation.stack.pop();if(state.view==='detail'){while(previous?.view==='detail')previous=yjNavigation.stack.pop()}if(!previous){if(state.view!=='home'){state.view='home';if(typeof live!=='undefined'){live.openSourceId=null;live.detail=null}render()}return}state.view=previous.view;if(typeof live!=='undefined'){live.detail=previous.detail;live.openSourceId=previous.openSourceId;live.selectedSourceId=previous.selectedSourceId;live.collectionKind=previous.collectionKind;live.rankingIndex=previous.rankingIndex}render()}catch(error){state.view='home';if(typeof live!=='undefined'){live.detail=null;live.openSourceId=null}try{render()}catch(e){app.innerHTML='<main class="yj-page"><div class="empty">返回失败：'+String(e.message||error.message||'未知错误')+'</div></main>'}if(typeof notify==='function')notify('返回失败：'+String(error.message||'请重试'))}};
const titles=[],posters=[],modules=[];
let home,detail,player,settings,settingsV2,calendar,watchlist,library,downloads,searchPage,detailV2;
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const icons={home:'<path d="M4 11.5 12 5l8 6.5V20H4z"/>',search:'<circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4m8-4v4M3 10h18"/>',watch:'<path d="M5 4h14v17l-7-4-7 4z"/>',library:'<rect x="4" y="4" width="6" height="16" rx="2"/><rect x="14" y="4" width="6" height="16" rx="2"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1-2-4-2 1a7 7 0 0 0-2-1l-.3-2h-5L9 6a7 7 0 0 0-2 1L5 6 3 10l2 1a7 7 0 0 0 0 2l-2 1 2 4 2-1a7 7 0 0 0 2 1l.5 2h5l.5-2a7 7 0 0 0 2-1l2 1 2-4-2-1z"/>',plus:'<path d="M12 5v14M5 12h14"/>',play:'<path d="m9 7 8 5-8 5z"/>',check:'<path d="m6 12 4 4 8-9"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',chevron:'<path d="m9 6 6 6-6 6"/>',smart:'<path d="M12 3 9.8 8.8 4 11l5.8 2.2L12 19l2.2-5.8L20 11l-5.8-2.2z"/>',bell:'<path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',pause:'<path d="M9 7v10m6-10v10"/>',refresh:'<path d="M20 6v5h-5"/><path d="M19 11a8 8 0 1 0 1 5"/>',history:'<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',sun:'<circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M20 15.3A8.5 8.5 0 0 1 8.7 4 8.5 8.5 0 1 0 20 15.3Z"/>',display:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>',close:'<path d="m7 7 10 10M17 7 7 17"/>'};
const ico=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.more}</svg>`;
function notify(message){status.textContent=message;status.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>status.classList.remove('show'),2200)}
function render(){document.body.classList.toggle('light',state.theme==='light');const routes={home,detail:detailV2||detail,player,settings:settingsV2||settings,calendar,watchlist,library,downloads,search:searchPage,ranking:()=>showLiveRanking?.(live?.rankingIndex),collection:()=>showLiveCollection?.(live?.collectionKind)};(routes[state.view]||home)?.();scrollTo(0,0)}
document.addEventListener('click',event=>{const target=event.target.closest('[data-yj-back]');if(!target)return;event.preventDefault();event.stopImmediatePropagation();yjBack()},true);
document.addEventListener('click',event=>{const interactive=event.target.closest('button[data-appearance],[data-edit-server],[data-edit-file],[data-live-detail],[data-emby-play],[data-url-play],[data-toggle-library-server],[data-provider],[data-go]');if(!interactive||interactive.closest('button[data-appearance],[data-edit-server],[data-edit-file],[data-live-detail],[data-emby-play],[data-url-play],[data-toggle-library-server],[data-provider]'))return;const target=interactive.closest('button[data-go],a[data-go]');if(!target||!target.isConnected)return;yjNavigate(target.dataset.go)});
window.addEventListener('error',event=>{if(app.querySelector('main,.play'))return;app.innerHTML=`<main class="fatal"><b>界面无法载入</b><p>${esc(event.message||'请重新启动映迹。')}</p><button onclick="location.reload()">重新载入</button></main>`});
</script><script src="runtime-config.js"></script><script src="integration.js"></script><script src="ui.js"></script><script src="desktop.js"></script></body></html>
