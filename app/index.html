function detail(){const first=media.episodes.find(e=>!media.watched.includes(e))||media.episodes.at(-1);state.episode=state.episode||first;const eps=media.episodes.map(e=>`<button class="ep ${e===state.episode?'on':''}" data-episode="${e}">${String(e).padStart(2,'0')}<br><small>${media.watched.includes(e)?'已播放':e===first?'最早未播':'未播放'}</small></button>`).join('');const sources=state.servers.map((s,i)=>`<div class="source ${i===0&&s.online?'best':''} ${s.online?'':'offline'}"><div><b>${esc(s.name)}</b><br><small>${s.online?'可用':'连接超时 · 可重试'}</small></div><span class="quality">${i?'1080P':'4K Dolby Vision'}</span><span>${i?'H.264 · 转码':'HEVC · 直连'}</span><span>${s.online?(18+i*45)+' ms':'不可用'}</span></div>`).join('')||'<div class="empty">尚未添加服务器。请先前往设置添加 Emby 服务器。</div>';app.innerHTML=shell(`<main class="detail"><button class="back" data-go="home">← 返回首页</button><h1>${media.title}</h1><div class="meta">${media.year} · 科幻 / 悬疑 · 3 季 · TMDB 8.4 · Trakt 热度 92</div><p class="desc">${media.desc}</p><div class="actions"><button class="primary" data-play>▶ 播放第 ${state.episode} 集</button><button class="secondary">加入片单</button><button class="secondary">整季下载</button></div><h2>选集与资源</h2><div class="episodes">${eps}</div><section class="sources"><h2>第 ${state.episode} 集资源</h2><p>已搜索 ${state.servers.length} 个 Emby 服务器，优先选择直连、画质最高且延迟最低的版本。</p>${sources}</section><div class="info-sections"><section class="info-block"><h2>预告片</h2><div class="trailer"><div><b>官方预告 · 2:14</b><br><small>来源：TMDB 视频资料</small></div><button class="primary">▶ 播放预告</button></div></section><section class="info-block"><h2>演员</h2><div class="cast"><div class="person"><b>林岚</b><small>饰 周言</small></div><div class="person"><b>陈默</b><small>饰 顾行舟</small></div><div class="person"><b>许冬</b><small>饰 叶澜</small></div><div class="person"><b>秦舟</b><small>饰 罗森</small></div><div class="person"><b>周野</b><small>饰 韩潮</small></div></div></section><section class="info-block"><h2>影片资料</h2><p>${media.desc}</p><p><b>类型</b>　科幻、悬疑　　<b>首 function detailV2(){const first=media.episodes.find(e=>!media.watched.includes(e))||media.episodes.at(-1);state.episode=state.episode||first;

const epGrid=media.episodes.map((e,i)=>`<article class="ep-grid-card ${e===state.episode?'on':''}" data-episode="${e}" tabindex="0"><div class="ep-grid-thumb p${(i%8)}" style="background-position:${i%2?'center':'55% center'}"></div><div class="ep-grid-info"><h3>${new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric'}).format(new Date(2026,7,18+e))}</h3><b>第${e}集 · ${epTitles[e-1]}</b><p>${epDescs[e-1]}</p></div></article>`).join('');
const epPages=[[1,30],[31,60],[61,90],[91,120]].map(([s,e],i)=>`<button class="ep-page ${i===0?'on':''}">${s} · ${e}</button>`).join('');
const resCards=[{name:'Echo-Super',size:'2.2 GB',speed:'13.15Mbps',source:'Echo-Super',online:true},{name:'墨云间',size:'2.2 GB',speed:'13.15Mbps',source:'墨云间',online:false}].map(r=>`<article class="res-card ${r.online?'':'dimmed'}"><div class="res-header"><span class="res-quality">SDR</span><b>${r.name}</b></div><div class="res-meta"><span>&#128190; ${r.size}</span><span>&#9889; ${r.speed}</span></div><div class="res-source"><span class="res-avatar">${r.source[0]}</span> ${r.source}<strong class="${r.online?'ok':''}">${r.online?'&#10003;':''}</strong></div></article>`).join('');
app.innerHTML=shell(`<main class="design-detail"><div class="detail-canvas" style="--detail-backdrop:url('yingji-hero-original.png')"><div class="detail-hero-copy"><h1>${media.title}</h1><div class="detail-subtitle">2004-10-05&#160;&#160;动作冒险 / 动画 / 科幻奇幻&#160;&#160;23 分钟</div><div class="detail-play-btn" data-play><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5z"/></svg> 播放&#160;&#160;第${state.episode}集 · ${epTitles[state.episode-1]}</div><div class="detail-icon-row"><button class="round-action" title="分享"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><path d="M18 9v4m-3 3 3 3 3-3m-6-5H6a3 3 0 0 0-3 3v6a3 3 0 0 0 3 3h6"/></svg></button><button class="round-action" title="下载"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/></svg></button><button class="round-action" title="收藏"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-7-10a7 7 0 1 1 14 0c0 5.6-7 10-7 10z"/></svg></button><button class="round-action" title="日历"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4m8-4v4M3 10h18"/></svg></button></div><p class="detail-overview">「${media.desc.substring(0,60)}…」即将于 2026-08-29 更新第46集</p><div class="hero-ratings"><span class="rating-imdb"><b>IMDB</b> 8.3</span><span class="rating-douban"><b>豆瓣</b> 8.4</span><span class="rating-love"><i>&#10084;</i> 100%</span><span class="rating-hot"><i>&#128293;</i> 88%</span><span class="rating-fresh"><b>鲜</b> 88%</span></div></div>
<div class="detail-flow">
<section class="detail-episodes"><div class="season-picker"><select><option>第 1 季</option><option>第 2 季</option><option>第 3 季</option></select></div><div class="ep-grid">${epGrid}</div><div class="ep-pagination">${epPages}<button class="ep-next">&#8594;</button></div></section>
<section class="detail-side"><div class="resource-panel"><h2>播放资源：</h2><div class="resolution-filter"><button class="on">4K</button><button>1080P</button><button>720P</button><button>480P</button></div><div class="resource-list">${resCards}</div><button class="expand-info">&#8853; 展开媒体信息</button></div></section>
</div></div></main>`,'detail')}<button class="back" data-go="home">← 返回首页</button><h1>${media.title}</h1><div class="meta">${media.year} · 科幻 / 悬疑 · 3 季 · TMDB 8.4 · Trakt 热度 92</div><p class="desc">${media.desc}</p><div class="actions"><button class="primary" data-play>▶ 播放第 ${state.episode} 集</button><button class="secondary" data-watch="0">${state.watchlist.includes(0)?'✓ 已加入待看':'＋ 加入待看'}</button><button class="secondary">整季下载</button></div><h2>选集与资源</h2><div class="episode-cards">${eps}</div><section class="sources"><h2>第 ${state.episode} 集资源</h2><p>已搜索 ${state.servers.length} 个 Emby 服务器，优先选择直连、画质最高且延迟最低的版本。</p>${sources}</section><div class="info-sections"><section class="info-block"><h2>预告片</h2><div class="trailer"><div><b>官方预告 · 2:14</b><br><small>来源：TMDB 视频资料</small></div><button class="primary">▶ 播放预告</button></div></section><section class="info-block"><h2>演员</h2><div class="cast">${people.map((n,i)=>`<div class="person"><div class="person-photo p${i}"></div><div class="person-copy"><b>${n}</b><small>饰 ${['周言','顾行舟','叶澜','罗森','韩潮'][i]}</small></div></div>`).join('')}</div></section><section class="info-block"><h2>影片资料</h2><p>${media.desc}</p><p><b>类型</b>　科幻、悬疑　　<b>首播</b>　2026　　<b>数据来源</b>　TMDB / Trakt</p></section></div></main>`)}
function calendar(){const dayGroups=[{label:'周一',date:'08/24',sub:'今天',items:[{id:0,title:'绿光军团',year:2026,genre:'剧情,悬疑,Sci-Fi & Fantasy',season:'第1季',ep:'集 2/8',time:'09:00',source:'HBO',prog:25},{id:2,title:'柯蒂斯总统',year:2026,genre:'动画,喜剧',season:'第1季',ep:'集 5/10',time:'11:30',source:'[adult swim]',prog:50}]},{label:'周二',date:'08/25',sub:'明天',items:[{id:4,title:'师兄太稳健',year:2026,genre:'喜剧,动作冒险,Sci-Fi & Fantasy',season:'第1季',ep:'集 14、15/30',time:'12:00',source:'YOUKU',prog:46}]},{label:'周三',date:'08/26',sub:'2天后',items:[{id:4,title:'师兄太稳健',year:2026,genre:'喜剧,动作冒险,Sci-Fi & Fantasy',season:'第1季',ep:'集 16、17/30',time:'12:00',source:'YOUKU',prog:53}]},{label:'周四',date:'08/27',sub:'3天后',items:[{id:4,title:'师兄太稳健',year:2026,genre:'喜剧,动作冒险,Sci-Fi & Fantasy',season:'第1季',ep:'集 16、17/30',time:'12:00',source:'YOUKU',prog:53}]}];const calHtml='<div class="cal-segmented"><button class="on">在看</button><button>日历</button><button>待看</button></div>'+dayGroups.map(g=>'<div class="cal-day-group"><div class="cal-day-header"><h3>'+g.label+'</h3><span>'+g.date+'</span><small>'+g.sub+'</small></div><div class="cal-day-items">'+g.items.map(it=>`<article class="cal-card" data-detail="${it.id}"><div class="cal-thumb p${it.id}"></div><div class="cal-card-main"><b>${it.title}</b><span class="cal-card-meta">${it.year} · ${it.genre}</span><strong>${it.season}</strong> ${it.ep}<br><small>${it.time}</small></div><span class="cal-platform">${it.source}</span><time>🕐 ${it.time}</time><div class="cal-progress"><i style="width:${it.prog}%"></i></div></article>`).join('')+'</div></div>').join('');app.innerHTML=shell('<main class="calendar-page">'+calHtml+'</main>','calendar')}
function watchlist(){const cards=state.watchlist.map((id,i)=>`<article class="watch-card"><div class="watch-poster p${id}"></div><div class="watch-copy"><b>${titles[id]}</b><p>下一集预计 ${i+1} 天后更新</p><button class="secondary" data-detail="${id}">查看详情</button></div></article>`).join('')||'<div class="empty">待看列表为空。在影片详情页点击“加入待看”。</div>';app.innerHTML=shell(`<main class="simple-page"><h1>待看</h1><p>加入待看的剧集会自动进入追剧日历。</p><div class="watch-grid">${cards}</div></main>`,'watchlist')}
function library(){const rows=state.servers.map((s,i)=>`<div class="config"><div><b>${esc(s.name)}</b><br><small>${esc(s.url)}</small></div><span>${s.online?'在线':'未测试'}</span><button class="delete" data-delete="servers:${i}">删除</button></div>`).join('')||'<div class="empty">尚未添加 Emby 服务器。</div>';app.innerHTML=shell(`<main class="simple-page"><h1>媒体库</h1><p>管理 Emby 服务器并查看跨服务器统一片库。</p><div class="library-grid"><section class="panel"><h2>Emby 服务器</h2>${rows}<form data-form="servers"><input name="name" maxlength="40" required placeholder="服务器名称"><input name="url" type="url" required placeholder="https://emby.example.com"><button>添加</button></form></section><section class="panel"><h2>统一片库</h2><p>已合并 ${state.servers.length} 个服务器中的同名影片；TMDB ID、IMDb ID、年份和标题别名用于去重。</p><div class="config"><b>影片与剧集</b><span>1,248 项</span></div><div class="config"><b>需要人工确认的重复项</b><span>6 项</span></div></section></div></main>`,'library')}
function downloads(){app.innerHTML=shell(`<main class="simple-page"><h1>下载</h1><p>离线内容、空间和任务状态。</p><div class="download-grid"><article class="panel"><h2>边界来信 · 第 5 集</h2><p>4K HEVC · 8.2 GB</p><div class="timeline"><i style="width:62%"></i></div></article><article class="panel"><h2>山海之间 · 第 8 集</h2><p>1080P · 等待中</p></article></div></main>`,'downloads')}
function searchPage(){app.innerHTML=shell(`<main class="search-page"><h1>搜索</h1><input class="search-large" autofocus placeholder="搜索 TMDB、Trakt 与所有 Emby 服务器"><p class="translation-note">英文标题会优先读取 TMDB 中文翻译；缺失时翻译并保存中文缓存。</p></main>`,'search')}
function settingsV2(){const d=state.danmaku.map((x,i)=>`<div class="config"><div><b>${esc(x.name)}</b><br><small>${esc(x.url)}</small></div><span>已启用</span><button class="delete" data-delete="danmaku:${i}">删除</button></div>`).join('')||'<div class="empty">尚未添加弹幕 API。</div>';app.innerHTML=shell(`<main class="settings"><h1>设置</h1><div class="settings-grid"><section class="panel"><h2>数据来源</h2><div class="config"><b>TMDB</b><span>海报、中文资料、剧集、演员</span></div><div class="config"><b>Trakt</b><span>趋势、观看记录、追剧日历</span></div><p>API 密钥将在正式 Windows 版本中进入系统安全凭据存储。</p></section><section class="panel"><h2>弹幕 API</h2>${d}<form data-form="danmaku"><input name="name" maxlength="40" required placeholder="接口名称"><input name="url" type="url" required placeholder="https://api.example.com"><button>添加</button></form></section></div></main>`,'settings')}
function render(){document.body.classList.remove('detail-mode');document.body.classList.add('reference-ui');document.body.classList.toggle('light',state.theme==='light');document.body.classList.toggle('nav-left',state.layout==='left');({home,detail:detailV2,player,settings:settingsV2,calendar,watchlist,library,downloads,search:searchPage}[state.view]||home)();scrollTo(0,0)}
function notify(msg){status.textContent=msg;status.classList.add('show');setTimeout(()=>status.classList.remove('show'),1800)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-detail],[data-episode],[data-play],[data-delete],[data-theme],[data-layout],[data-move],[data-watch]');if(!t)return;if(t.hasAttribute('data-theme')){state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('yingji.theme',state.theme);render()}else if(t.hasAttribute('data-layout')){state.layout=state.layout==='top'?'left':'top';localStorage.setItem('yingji.layout',state.layout);render()}else if(t.dataset.move){const[p,d]=t.dataset.move.split(':').map(Number),q=p+d;[state.moduleOrder[p],state.moduleOrder[q]]=[state.moduleOrder[q],state.moduleOrder[p]];localStorage.setItem('yingji.moduleOrder',JSON.stringify(state.moduleOrder));home();notify('榜单顺序已保存')}else if(t.dataset.watch!==undefined){const id=Number(t.dataset.watch),i=state.watchlist.indexOf(id);i<0?state.watchlist.push(id):state.watchlist.splice(i,1);localStorage.setItem('yingji.watchlist',JSON.stringify(state.watchlist));render();notify(i<0?'已加入待看和追剧日历':'已移出待看')}else if(t.dataset.go){state.view=t.dataset.go;render()}else if(t.dataset.detail!==undefined){state.view='detail';render()}else if(t.dataset.episode){state.episode=Number(t.dataset.episode);detailV2()}else if(t.hasAttribute('data-play')){state.view='player';render()}else if(t.dataset.delete){const[type,i]=t.dataset.delete.split(':');state[type].splice(Number(i),1);localStorage.setItem('yingji.'+type,JSON.stringify(state[type]));render();notify('已删除')}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-detail]'))e.target.click();if(e.key==='Escape'&&state.view==='player'){state.view='detail';render()}});
document.addEventListener('submit',e=>{e.preventDefault();const type=e.target.dataset.form;if(!type)return;const f=new FormData(e.target),name=f.get('name').trim(),url=f.get('url').trim();try{new URL(url)}catch{return notify('请输入完整的 http 或 https 地址')}state[type].push(type==='servers'?{name,url,online:false}:{name,url});localStorage.setItem('yingji.'+type,JSON.stringify(state[type]));render();notify('已添加 '+name)});
render();
</script><script src="runtime-config.js"></script><script src="integration.js"></script><script src="desktop.js"></script></body></html>
