name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (split-per-abi)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # 只对 error 中断：编译错误在这里就能暴露，不必等到 3 分钟后的 Gradle。
        # info / warning 不阻断（历史代码可能已有告警）。
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Ensure gradlew executable
        run: chmod +x android/gradlew

      - name: Show toolchain
        run: |
          flutter doctor -v || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(no platforms dir)"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "(no ndk dir)"

      - name: Build APK
        # 未配置 key.properties 时自动回退到 debug 签名，CI 无需密钥
        run: |
          set -o pipefail
          flutter build apk --split-per-abi --release 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect APK info
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mova-android-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach APK to Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: mova-android-apk-${{ github.sha }}
          path: apk

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
