name: Release

# 每次推送 main 都更新 Mova Continuous 预发布；推送 v3.1.81 这类标签
# 则创建正式 GitHub Release。手动触发时填 tag 才发布，留空只构建。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '版本 tag（如 v3.1.81）；留空则只构建、不发布'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve version
    # 正式发版提交会紧接着推送 tag；main 事件跳过，避免同一提交构建两遍。
    if: github.event_name != 'push' || github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
      publish: ${{ steps.r.outputs.publish }}
      continuous: ${{ steps.r.outputs.continuous }}
      release_name: ${{ steps.r.outputs.release_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag / pubspec
        id: r
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          IN_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          pub=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -1)
          continuous=false
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "branch" ]; then
            tag="continuous"; publish=true; continuous=true
          elif [ "$EVENT" = "push" ]; then
            tag="$REF_NAME"; publish=true
          elif [ -n "${IN_TAG:-}" ]; then
            tag="$IN_TAG"; publish=true
          else
            tag="v$pub"; publish=false
          fi
          if [ "$continuous" = true ]; then
            version="$pub"
          else
            version="${tag#v}"
          fi
          if [ "$continuous" = true ]; then
            release_name="Mova Continuous"
          else
            release_name="Mova $tag"
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "publish=$publish"
            echo "continuous=$continuous"
            echo "release_name=$release_name"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$tag  version=$version  publish=$publish  pubspec=$pub"
          if [ "$continuous" != true ] && [ "$version" != "$pub" ]; then
            echo "::warning::pubspec.yaml 版本为 $pub，与 tag $version 不一致，安装包以 tag 为准"
          fi

  windows:
    name: Build Windows
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install 7-Zip for pinned libmpv archive
        run: choco install 7zip --no-progress -y

      - name: Replace legacy Flutter texture libmpv
        shell: pwsh
        run: .\tool\install_windows_gpu_next.ps1 -TargetDirectory build\windows\x64\runner\Release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package installer
        shell: pwsh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = 'C:\Program Files\Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe 未找到' }
          & $iscc "/DAppVersion=$env:VERSION" 'installer\Mova.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 打包失败: $LASTEXITCODE" }

      - name: Package portable archive
        shell: pwsh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          Compress-Archive -Path 'build\windows\x64\runner\Release\*' `
            -DestinationPath "Mova-$env:VERSION-Windows-x64-Portable.zip" -Force

      - name: Collect release assets
        # 先收进一个目录再上传：多路径模式下 upload-artifact 会把
        # dist-installer/ 前缀一起带进 artifact，下游 glob 就匹配不到安装包了。
        shell: pwsh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts | Out-Null
          Copy-Item 'dist-installer\*.exe' dist-artifacts\
          Copy-Item "Mova-$env:VERSION-Windows-x64-Portable.zip" dist-artifacts\
          Get-ChildItem dist-artifacts |
            Select-Object Name, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mova-windows
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 30

  android:
    name: Build Android
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      signing: ${{ steps.sign.outputs.signing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore release keystore
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ]; then
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次以 debug 签名出包：新用户可正常安装，但已装 release 签名旧版的用户无法覆盖更新。"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > android/mova-signing.jks
          # 写绝对路径：Gradle 里的 file() 相对 android/app/ 解析，绝对路径最不容易踩坑
          {
            echo "storeFile=$GITHUB_WORKSPACE/android/mova-signing.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=${KEY_ALIAS:-mova}"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties
          echo "signing=release" >> "$GITHUB_OUTPUT"
          echo "已写入 release 签名配置（alias=${KEY_ALIAS:-mova}）"

      - name: Ensure gradlew executable
        run: chmod +x android/gradlew

      - name: Build split APKs
        run: flutter build apk --split-per-abi --release

      - name: Verify APK signing
        # 发版的核心风险就在这一步：签名不对，用户装不上更新，而构建却"成功"。
        # 所以让流水线自己验，配置了 keystore 却仍是 debug 签名就直接失败。
        env:
          SIGNING: ${{ steps.sign.outputs.signing }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          apk=$(ls build/app/outputs/flutter-apk/app-*-release.apk | head -1)
          out=$("$APKSIGNER" verify --print-certs "$apk")
          echo "$out" | grep -E "certificate DN|SHA-256 digest" || true
          if echo "$out" | grep -q "CN=Android Debug"; then
            if [ "$SIGNING" = "release" ]; then
              echo "::error::已配置 keystore，APK 却仍是 debug 签名 —— 已安装旧版的用户会无法覆盖更新"
              exit 1
            fi
            echo "::warning::本次为 debug 签名（仓库未配置 ANDROID_KEYSTORE_BASE64）"
          else
            echo "APK 已使用发布签名"
          fi

      - name: Rename APKs with version and ABI
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi="${f#app-}"
            abi="${abi%-release.apk}"
            mv "$f" "Mova-${VERSION}-android-${abi}.apk"
          done
          ls -lh

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mova-android
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [meta, windows, android]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Move continuous tag to this build
        if: needs.meta.outputs.continuous == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const parameters = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'tags/continuous',
              sha: context.sha,
              force: true,
            };
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/continuous',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'refs/tags/continuous',
                sha: context.sha,
              });
              return;
            }
            await github.rest.git.updateRef(parameters);

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Flatten assets
        # 兜底：不管 artifact 内部是什么结构，都展平到一个目录再发布，
        # 否则 softprops/action-gh-release 会跳过目录、静默漏掉文件。
        run: |
          mkdir -p flat
          find dist -type f -exec cp {} flat/ \;
          ls -lh flat

      - name: Write summary
        run: |
          {
            echo "### ${{ needs.meta.outputs.release_name }}"
            echo ""
            echo "- Windows: 安装程序 + 免安装包"
            echo "- Android: 三个 ABI 的 APK（签名方式：${{ needs.android.outputs.signing }}）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.meta.outputs.release_name }}
          files: flat/*
          overwrite_files: true
          prerelease: ${{ needs.meta.outputs.continuous == 'true' }}
          make_latest: ${{ needs.meta.outputs.continuous != 'true' }}
          generate_release_notes: ${{ needs.meta.outputs.continuous != 'true' }}
          body: |
            > 若此发布名为 `Mova Continuous`，它是随 main 更新的测试预发布；Android 包不保证可覆盖正式版，请优先使用正式标签 Release。

            ## 下载

            **Windows**
            - `Mova-${{ needs.meta.outputs.version }}-Windows-x64-Setup.exe` — 安装程序（推荐）
            - `Mova-${{ needs.meta.outputs.version }}-Windows-x64-Portable.zip` — 免安装，解压即用

            **Android**
            - `Mova-${{ needs.meta.outputs.version }}-android-arm64-v8a.apk` — 绝大多数现代手机（推荐）
            - `Mova-${{ needs.meta.outputs.version }}-android-armeabi-v7a.apk` — 较老的 32 位设备
            - `Mova-${{ needs.meta.outputs.version }}-android-x86_64.apk` — 模拟器 / x86 平板

            安卓安装包与历史版本使用同一签名，可直接覆盖更新，观看记录与配置不会丢失。
