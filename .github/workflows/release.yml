name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --config.blockExoticSubdeps=false
      - run: pnpm run fetch:mpv
      - run: pnpm run dist:installer
      - run: Move-Item dist/Yingji-1.0.0-Windows-x64.exe dist/Yingji-1.0.0-Setup-x64.exe
      - run: pnpm run dist:portable
      - run: Move-Item dist/Yingji-1.0.0-Windows-x64.exe dist/Yingji-1.0.0-Portable-x64.exe
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/Yingji-1.0.0-Setup-x64.exe dist/Yingji-1.0.0-Portable-x64.exe --generate-notes --title "映迹 1.0.0"
